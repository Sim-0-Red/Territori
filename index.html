<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappa con Confini Blu e Navigatore</title>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }

    .nav-marker-wrapper {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .nav-arrow {
      width: 32px;
      height: 32px;
      transform-origin: center center;
      transition: transform 0.15s linear;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const mieiPoligoni = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "geometry": {
            "coordinates": [
              [7.734741, 45.108882],
              [7.734301, 45.10811],
              [7.73429, 45.10797],
              [7.734687, 45.107766],
              [7.734961, 45.107486],
              [7.735084, 45.107149],
              [7.735396, 45.106297],
              [7.735487, 45.105884],
              [7.735797, 45.1044],
              [7.73584, 45.104021],
              [7.735601, 45.103799],
              [7.735955, 45.103368],
              [7.737264, 45.102233],
              [7.738144, 45.101416],
              [7.738574, 45.10128],
              [7.739518, 45.101416],
              [7.740076, 45.101212],
              [7.740699, 45.101038],
              [7.741332, 45.100743],
              [7.741407, 45.10069],
              [7.740999, 45.100296],
              [7.74071, 45.099888],
              [7.740431, 45.099419],
              [7.740044, 45.098556],
              [7.739604, 45.097398],
              [7.739411, 45.096922],
              [7.739422, 45.096536],
              [7.739035, 45.095491],
              [7.741128, 45.096142],
              [7.744219, 45.097096],
              [7.74649, 45.09775],
              [7.747413, 45.097924],
              [7.748454, 45.098227],
              [7.748873, 45.098287],
              [7.748948, 45.099589],
              [7.749409, 45.100573],
              [7.750629, 45.100321],
              [7.751433, 45.101215],
              [7.75168, 45.103138],
              [7.750043, 45.103576],
              [7.74883, 45.104094],
              [7.747607, 45.104623],
              [7.746877, 45.105085],
              [7.746372, 45.105546],
              [7.745997, 45.105743],
              [7.745331, 45.106053],
              [7.744636, 45.105289],
              [7.742339, 45.105653],
              [7.741404, 45.105842],
              [7.742811, 45.107968],
              [7.734826, 45.108878]
            ],
            "type": "LineString"
          }
        }
      ]
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          esriStreet: {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            attribution: '© Esri, OpenStreetMap contributors'
          }
        },
        layers: [
          {
            id: 'esri-street-layer',
            type: 'raster',
            source: 'esriStreet'
          }
        ]
      },
      center: [7.743, 45.102],
      zoom: 14
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'top-right');

    // Crea il triangolino/freccia da navigatore
    const wrapperEl = document.createElement('div');
    wrapperEl.className = 'nav-marker-wrapper';

    const arrowEl = document.createElement('div');
    arrowEl.className = 'nav-arrow';
    arrowEl.innerHTML = `
      <svg viewBox="0 0 32 32" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
        <polygon points="16,3 27,27 16,21 5,27" fill="#0066ff" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
      </svg>
    `;
    wrapperEl.appendChild(arrowEl);

    let navMarker = null;
    let lastHeading = 0;

    // Nascondiamo il pallino standard così mostriamo solo il triangolino da navigatore
    const geolocate = new maplibregl.GeolocateControl({
      positionOptions: {
        enableHighAccuracy: true
      },
      trackUserLocation: true,
      showUserLocation: false,
      showAccuracyCircle: false
    });
    map.addControl(geolocate, 'top-right');

    geolocate.on('geolocate', (e) => {
      const { longitude, latitude, heading } = e.coords;
      const coords = [longitude, latitude];

      if (!navMarker) {
        navMarker = new maplibregl.Marker({
          element: wrapperEl,
          rotationAlignment: 'map',
          pitchAlignment: 'map'
        })
          .setLngLat(coords)
          .addTo(map);
      } else {
        navMarker.setLngLat(coords);
      }

      // Se il dispositivo fornisce heading (in gradi, 0 = Nord), ruota il triangolo
      if (typeof heading === 'number' && !Number.isNaN(heading)) {
        lastHeading = heading;
      }

      arrowEl.style.transform = `rotate(${lastHeading}deg)`;
    });

    map.on('load', () => {
      map.addSource('confini', {
        type: 'geojson',
        data: mieiPoligoni
      });

      map.addLayer({
        id: 'poligoni-bordo',
        type: 'line',
        source: 'confini',
        paint: {
          'line-color': '#0066ff',
          'line-width': 4
        }
      });

      const coords = mieiPoligoni.features[0].geometry.coordinates;
      const bounds = coords.reduce(
        (b, coord) => b.extend(coord),
        new maplibregl.LngLatBounds(coords[0], coords[0])
      );
      map.fitBounds(bounds, { padding: 40 });
    });
  </script>
</body>
</html>
