<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aggiornatore di gruppo HTML MapLibre (v4)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 740px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #1e293b;
      background: #f8fafc;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    button {
      background: #0066ff;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      margin-right: 8px;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    #log {
      margin-top: 18px;
      background: #0f172a;
      color: #e2e8f0;
      padding: 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      max-height: 280px;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Aggiorna i tuoi file HTML in una sola volta</h1>
    <p>Seleziona tutti i tuoi file <code>.html</code> esistenti. Per ciascun file viene preservato il proprio <code>og:title</code> personale (e il <code>&lt;title&gt;</code> originale), insieme a GeoJSON, coordinate e zoom, applicando la nuova base completa.</p>

    <input id="fileInput" type="file" accept=".html,text/html" multiple />
    <div>
      <button id="processBtn" disabled>Elabora file selezionati</button>
      <button id="downloadAllBtn" disabled>Scarica tutti i file aggiornati</button>
    </div>

    <div id="log">In attesa di selezionare i file...</div>
  </div>

  <script>
    const BASE_TEMPLATE = `<!DOCTYPE html>
<html lang="it">
<head>
<!-- Tag Open Graph per anteprima link -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="__OG_TITLE__" />
  <meta property="og:description" content="Mappa interattiva con confini e navigatore Course-Up" />
  <meta property="og:image" content="https://sim-0-red.github.io/Territori/anteprima.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>__DOC_TITLE__</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"><\/script>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; touch-action: none; }

    .nav-marker-wrapper {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .nav-arrow {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
    }

    /* Pulsante per attivare/disattivare Course-Up */
    .course-up-btn {
      background: #ffffff;
      border: none;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .course-up-btn.active {
      background: #0066ff;
      color: #ffffff;
    }

    /* Pulsante per alternare vista 2D / 3D */
    .view-mode-btn {
      background: #ffffff;
      border: none;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .view-mode-btn.is-3d {
      background: #1e293b;
      color: #ffffff;
    }

    /* Controlli zoom + / - compatibili con Course-Up */
    .zoom-step-group {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .zoom-step-btn {
      width: 32px;
      height: 32px;
      background: #ffffff;
      border: none;
      cursor: pointer;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-step-btn + .zoom-step-btn {
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }

    .zoom-step-btn:active {
      background: #e2e8f0;
    }

    #err-box {
      display: none;
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 9999;
      background: #fff3f3;
      color: #900;
      border: 2px solid #c00;
      border-radius: 6px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 35vh;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="err-box"></div>
  <script>
    window.addEventListener('error', (ev) => {
      const box = document.getElementById('err-box');
      if (box) {
        box.style.display = 'block';
        box.textContent += (box.textContent ? '\\n' : '') + (ev.message || 'Errore');
      }
    });

    // Impostazioni vista: 2D (pitch 0) o 3D (pitch 60)
    const PITCH_2D = 0;
    const PITCH_3D = 60;
    const ZOOM_STEP = 0.8;
    let is3DMode = false;

    function getTargetPitch() {
      return is3DMode ? PITCH_3D : PITCH_2D;
    }

    const confineGeoJSON = __GEOJSON__;

    function extractCoords(geojson) {
      const coords = [];
      function walk(node) {
        if (!node) return;
        if (Array.isArray(node)) {
          if (node.length >= 2 && typeof node[0] === 'number' && typeof node[1] === 'number') {
            coords.push([node[0], node[1]]);
          } else {
            for (const item of node) walk(item);
          }
        } else if (typeof node === 'object') {
          if (node.type === 'FeatureCollection' && Array.isArray(node.features)) {
            node.features.forEach(walk);
          } else if (node.type === 'Feature') {
            walk(node.geometry);
          } else if (node.coordinates) {
            walk(node.coordinates);
          }
        }
      }
      walk(geojson);
      return coords;
    }

    function fitBoundsToGeoJSON(mapInstance, geojson, animate = false) {
      const points = extractCoords(geojson);
      if (!points.length) return;

      const bounds = new maplibregl.LngLatBounds(points[0], points[0]);
      for (const pt of points) {
        bounds.extend(pt);
      }

      const isMobile = window.innerWidth < 768;
      const padding = isMobile
        ? { top: 65, bottom: 55, left: 35, right: 35 }
        : { top: 75, bottom: 65, left: 75, right: 95 };

      mapInstance.fitBounds(bounds, {
        padding,
        maxZoom: 18,
        duration: animate ? 500 : 0
      });
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          esriStreet: {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            attribution: '© Esri, OpenStreetMap contributors'
          }
        },
        layers: [
          {
            id: 'esri-street-layer',
            type: 'raster',
            source: 'esriStreet'
          }
        ]
      },
      center: __CENTER__,
      zoom: __ZOOM__,
      pitch: PITCH_2D
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: true, showZoom: false }), 'top-right');

    // Stato Course-Up e gestione interazioni touch/camera
    let courseUpEnabled = false;
    let navMarker = null;
    let lastHeading = 0;
    let lastCoords = null;
    let isProgrammaticMove = false;
    let moveResetTimer = null;
    let isUserPinchingOrZooming = false;
    let activeTouchCount = 0;

    function moveCameraSafe(options) {
      if (isUserPinchingOrZooming) return;
      isProgrammaticMove = true;
      if (moveResetTimer) clearTimeout(moveResetTimer);
      map.easeTo(options);
      map.once('moveend', () => {
        moveResetTimer = setTimeout(() => {
          isProgrammaticMove = false;
        }, 60);
      });
    }

    function stepZoom(delta) {
      const currentZoom = map.getZoom();
      const minZoom = map.getMinZoom();
      const maxZoom = map.getMaxZoom();
      const nextZoom = Math.min(maxZoom, Math.max(minZoom, currentZoom + delta));

      const cameraOptions = {
        zoom: nextZoom,
        pitch: getTargetPitch(),
        duration: 220
      };

      if (courseUpEnabled) {
        cameraOptions.center = lastCoords || map.getCenter();
        cameraOptions.bearing = lastHeading;
      }

      moveCameraSafe(cameraOptions);
    }

    async function requestCompassPermissionIfNeeded() {
      if (
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'
      ) {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch (_) {}
      }
    }

    // Controllo dedicato per zoom + / - anche con Course-Up attivo
    class ZoomStepControl {
      onAdd(map) {
        this._map = map;
        this._container = document.createElement('div');
        this._container.className = 'maplibregl-ctrl zoom-step-group';

        const plusBtn = document.createElement('button');
        plusBtn.type = 'button';
        plusBtn.className = 'zoom-step-btn';
        plusBtn.textContent = '+';
        plusBtn.title = 'Zoom avanti';
        plusBtn.setAttribute('aria-label', 'Zoom avanti');
        plusBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          stepZoom(ZOOM_STEP);
        });

        const minusBtn = document.createElement('button');
        minusBtn.type = 'button';
        minusBtn.className = 'zoom-step-btn';
        minusBtn.textContent = '−';
        minusBtn.title = 'Zoom indietro';
        minusBtn.setAttribute('aria-label', 'Zoom indietro');
        minusBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          stepZoom(-ZOOM_STEP);
        });

        this._container.appendChild(plusBtn);
        this._container.appendChild(minusBtn);
        return this._container;
      }

      onRemove() {
        this._container.parentNode.removeChild(this._container);
        this._map = undefined;
      }
    }

    map.addControl(new ZoomStepControl(), 'top-right');

    // Controllo per passare da 2D a 3D mantenendo lo stato Course-Up
    class ViewModeControl {
      onAdd(map) {
        this._map = map;
        this._container = document.createElement('div');
        this._container.className = 'maplibregl-ctrl';

        this._btn = document.createElement('button');
        this._btn.type = 'button';
        this._btn.className = 'view-mode-btn';
        this._btn.textContent = '2D';
        this._btn.title = 'Passa tra vista 2D e vista 3D';

        this._btn.addEventListener('click', () => {
          is3DMode = !is3DMode;
          this.updateUI();

          const cameraOptions = {
            pitch: getTargetPitch(),
            duration: 450
          };

          if (courseUpEnabled && lastCoords) {
            cameraOptions.center = lastCoords;
            cameraOptions.bearing = lastHeading;
          }

          moveCameraSafe(cameraOptions);
        });

        this._container.appendChild(this._btn);
        return this._container;
      }

      updateUI() {
        if (is3DMode) {
          this._btn.textContent = '3D';
          this._btn.classList.add('is-3d');
        } else {
          this._btn.textContent = '2D';
          this._btn.classList.remove('is-3d');
        }
      }

      onRemove() {
        this._container.parentNode.removeChild(this._container);
        this._map = undefined;
      }
    }

    const viewModeCtrl = new ViewModeControl();
    map.addControl(viewModeCtrl, 'top-right');

    // Controllo personalizzato per attivare/disattivare Course-Up
    class CourseUpControl {
      onAdd(map) {
        this._map = map;
        this._container = document.createElement('div');
        this._container.className = 'maplibregl-ctrl';

        this._btn = document.createElement('button');
        this._btn.type = 'button';
        this._btn.className = 'course-up-btn';
        this._btn.innerHTML = '🧭 Course-Up';
        this._btn.title = 'Attiva/Disattiva rotazione automatica mappa';

        this._btn.addEventListener('click', async () => {
          courseUpEnabled = !courseUpEnabled;
          this.updateUI();

          if (courseUpEnabled) {
            await requestCompassPermissionIfNeeded();
            if (lastCoords) {
              moveCameraSafe({
                center: lastCoords,
                bearing: lastHeading,
                pitch: getTargetPitch(),
                duration: 450
              });
            }
          } else {
            moveCameraSafe({
              bearing: 0,
              pitch: getTargetPitch(),
              duration: 450
            });
          }
        });

        this._container.appendChild(this._btn);
        return this._container;
      }

      updateUI() {
        if (courseUpEnabled) {
          this._btn.classList.add('active');
        } else {
          this._btn.classList.remove('active');
        }
      }

      onRemove() {
        this._container.parentNode.removeChild(this._container);
        this._map = undefined;
      }
    }

    const courseUpCtrl = new CourseUpControl();
    map.addControl(courseUpCtrl, 'top-right');

    // Traccia il numero di dita sullo schermo per distinguere pinch/zoom da pan manuale
    const mapContainer = map.getCanvasContainer();
    mapContainer.addEventListener('touchstart', (ev) => {
      activeTouchCount = ev.touches.length;
      if (activeTouchCount >= 2) {
        isUserPinchingOrZooming = true;
      }
    }, { passive: true });

    mapContainer.addEventListener('touchmove', (ev) => {
      activeTouchCount = ev.touches.length;
      if (activeTouchCount >= 2) {
        isUserPinchingOrZooming = true;
      }
    }, { passive: true });

    mapContainer.addEventListener('touchend', (ev) => {
      activeTouchCount = ev.touches.length;
      if (activeTouchCount < 2) {
        setTimeout(() => {
          isUserPinchingOrZooming = false;
        }, 120);
      }
    }, { passive: true });

    map.on('zoomstart', (ev) => {
      if (!isProgrammaticMove && ev && ev.originalEvent) {
        isUserPinchingOrZooming = true;
      }
    });

    map.on('zoomend', () => {
      if (activeTouchCount < 2) {
        setTimeout(() => {
          isUserPinchingOrZooming = false;
        }, 120);
      }
    });

    // Se l'utente sposta o ruota manualmente la mappa con un dito, mette in pausa Course-Up
    map.on('dragstart', (ev) => {
      if (isProgrammaticMove || !courseUpEnabled) return;
      if (isUserPinchingOrZooming || activeTouchCount >= 2) return;
      if (ev && ev.originalEvent) {
        courseUpEnabled = false;
        courseUpCtrl.updateUI();
      }
    });

    // Crea il triangolino/freccia da navigatore
    const wrapperEl = document.createElement('div');
    wrapperEl.className = 'nav-marker-wrapper';

    const arrowEl = document.createElement('div');
    arrowEl.className = 'nav-arrow';
    arrowEl.innerHTML = \`
      <svg viewBox="0 0 32 32" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
        <polygon points="16,3 27,27 16,21 5,27" fill="#0066ff" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
      </svg>
    \`;
    wrapperEl.appendChild(arrowEl);

    // Pulsante mirino GPS manuale (non sposta la mappa finché non lo premi)
    const geolocate = new maplibregl.GeolocateControl({
      positionOptions: {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 5000
      },
      trackUserLocation: false,
      showUserLocation: false,
      showAccuracyCircle: false
    });
    map.addControl(geolocate, 'top-right');

    function updateNavigationView(coords, heading) {
      if (!Array.isArray(coords) || coords.length !== 2) return;
      const [lon, lat] = coords;
      if (typeof lon !== 'number' || typeof lat !== 'number' || Number.isNaN(lon) || Number.isNaN(lat)) return;

      lastCoords = [lon, lat];

      if (typeof heading === 'number' && !Number.isNaN(heading)) {
        lastHeading = ((heading % 360) + 360) % 360;
      }

      if (!navMarker) {
        navMarker = new maplibregl.Marker({
          element: wrapperEl,
          rotationAlignment: 'map',
          pitchAlignment: 'map'
        })
          .setLngLat(lastCoords)
          .setRotation(lastHeading)
          .addTo(map);
      } else {
        navMarker.setLngLat(lastCoords);
        navMarker.setRotation(lastHeading);
      }

      // Sposta la camera solo se l'utente ha attivato Course-Up e non sta facendo pinch-to-zoom con le dita
      if (courseUpEnabled && !isUserPinchingOrZooming) {
        moveCameraSafe({
          center: lastCoords,
          bearing: lastHeading,
          zoom: map.getZoom(),
          pitch: getTargetPitch(),
          duration: 300,
          easing: (t) => t
        });
      }
    }

    geolocate.on('geolocate', (e) => {
      const { longitude, latitude, heading } = e.coords;
      updateNavigationView([longitude, latitude], heading);
    });

    // Tracciamento GPS in background: aggiorna la freccia senza spostare l'inquadratura iniziale
    function startBackgroundTracking() {
      if (!('geolocation' in navigator)) return;
      navigator.geolocation.watchPosition(
        (pos) => {
          const { longitude, latitude, heading } = pos.coords;
          updateNavigationView([longitude, latitude], heading);
        },
        () => {},
        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 10000
        }
      );
    }

    window.addEventListener('deviceorientationabsolute', (e) => {
      if (typeof e.alpha === 'number' && !Number.isNaN(e.alpha) && lastCoords && courseUpEnabled) {
        const compassHeading = (360 - e.alpha) % 360;
        updateNavigationView(lastCoords, compassHeading);
      }
    });

    window.addEventListener('deviceorientation', (e) => {
      if (typeof e.webkitCompassHeading === 'number' && !Number.isNaN(e.webkitCompassHeading) && lastCoords && courseUpEnabled) {
        updateNavigationView(lastCoords, e.webkitCompassHeading);
      }
    });

    map.on('load', () => {
      if (confineGeoJSON) {
        map.addSource('confine-source', {
          type: 'geojson',
          data: confineGeoJSON
        });

        map.addLayer({
          id: 'confine-line',
          type: 'line',
          source: 'confine-source',
          layout: {
            'line-join': 'round',
            'line-cap': 'round'
          },
          paint: {
            'line-color': '#0066ff',
            'line-width': 5,
            'line-opacity': 1
          }
        });

        fitBoundsToGeoJSON(map, confineGeoJSON, false);
      }

      startBackgroundTracking();
    });
  <\/script>
</body>
</html>`;

    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const logEl = document.getElementById('log');

    let updatedFiles = [];

    function log(msg) {
      logEl.textContent += '\n' + msg;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function escapeAttr(str) {
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function escapeHtmlText(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Estrae esattamente l'og:title del singolo file senza mai sovrascriverlo o modificarlo
    function extractOriginalOgTitle(htmlText, fallbackTitle) {
      const metaTags = htmlText.match(/<meta\b[^>]*>/gi) || [];
      for (const tag of metaTags) {
        const propMatch = tag.match(/\bproperty\s*=\s*(?:"([^"]*)"|'([^']*)')/i);
        const propVal = propMatch ? (propMatch[1] ?? propMatch[2] ?? '').trim().toLowerCase() : '';
        if (propVal === 'og:title') {
          const contentMatch = tag.match(/\bcontent\s*=\s*(?:"([^"]*)"|'([^']*)')/i);
          if (contentMatch) {
            return contentMatch[1] ?? contentMatch[2] ?? '';
          }
        }
      }
      return fallbackTitle;
    }

    function extractTitles(htmlText, fallbackName) {
      const titleMatch = htmlText.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
      const docTitle = titleMatch ? titleMatch[1].trim() : fallbackName;
      const ogTitle = extractOriginalOgTitle(htmlText, docTitle);
      return { docTitle, ogTitle };
    }

    function parseObjectAt(htmlText, startIdx) {
      let idx = startIdx;
      while (idx < htmlText.length && /\s/.test(htmlText[idx])) idx++;
      if (idx >= htmlText.length || (htmlText[idx] !== '{' && htmlText[idx] !== '[')) return null;

      const start = idx;
      let depth = 0;
      let inStr = null;
      let esc = false;

      for (let i = start; i < htmlText.length; i++) {
        const ch = htmlText[i];
        if (esc) { esc = false; continue; }
        if (ch === '\\' && inStr) { esc = true; continue; }
        if (ch === '"' || ch === "'" || ch === '`') {
          if (!inStr) inStr = ch;
          else if (inStr === ch) inStr = null;
          continue;
        }
        if (inStr) continue;
        if (ch === '{' || ch === '[') depth++;
        else if (ch === '}' || ch === ']') {
          depth--;
          if (depth === 0) {
            const raw = htmlText.slice(start, i + 1);
            try {
              return JSON.parse(raw);
            } catch (_) {
              try {
                return (new Function(`return (${raw});`))();
              } catch (err) {
                return null;
              }
            }
          }
        }
      }
      return null;
    }

    function extractGeoJson(htmlText) {
      const varRe = /\b(?:const|let|var)\s+([A-Za-z0-9_]*geojson[A-Za-z0-9_]*)\s*=\s*/gi;
      let match;
      while ((match = varRe.exec(htmlText)) !== null) {
        const parsed = parseObjectAt(htmlText, match.index + match[0].length);
        if (parsed && (parsed.type === 'FeatureCollection' || parsed.type === 'Feature' || Array.isArray(parsed.features))) {
          return parsed;
        }
      }

      const fcIdx = htmlText.indexOf('"FeatureCollection"');
      if (fcIdx !== -1) {
        let braceIdx = htmlText.lastIndexOf('{', fcIdx);
        while (braceIdx !== -1) {
          const parsed = parseObjectAt(htmlText, braceIdx);
          if (parsed && parsed.type === 'FeatureCollection' && Array.isArray(parsed.features)) {
            return parsed;
          }
          braceIdx = htmlText.lastIndexOf('{', braceIdx - 1);
        }
      }

      return null;
    }

    function computeBoundsCenter(geojson) {
      let minLon = Infinity, minLat = Infinity, maxLon = -Infinity, maxLat = -Infinity;
      function walk(coords) {
        if (!Array.isArray(coords)) return;
        if (typeof coords[0] === 'number' && typeof coords[1] === 'number') {
          const [lon, lat] = coords;
          if (lon < minLon) minLon = lon;
          if (lat < minLat) minLat = lat;
          if (lon > maxLon) maxLon = lon;
          if (lat > maxLat) maxLat = lat;
          return;
        }
        for (const c of coords) walk(c);
      }
      if (geojson && Array.isArray(geojson.features)) {
        for (const f of geojson.features) {
          if (f && f.geometry) walk(f.geometry.coordinates);
        }
      }
      if (Number.isFinite(minLon) && Number.isFinite(minLat)) {
        return [(minLon + maxLon) / 2, (minLat + maxLat) / 2];
      }
      return null;
    }

    function extractCenter(htmlText, geojson) {
      const centerVar = /\b(?:const|let|var)\s+center\s*=\s*/m.exec(htmlText);
      if (centerVar) {
        const parsed = parseObjectAt(htmlText, centerVar.index + centerVar[0].length);
        if (Array.isArray(parsed) && parsed.length === 2) return parsed;
      }

      const propMatch = htmlText.match(/\bcenter\s*:\s*(\[[^\]]+\])/);
      if (propMatch) {
        try {
          const arr = JSON.parse(propMatch[1]);
          if (Array.isArray(arr) && arr.length === 2) return arr;
        } catch (_) {}
      }

      const computed = computeBoundsCenter(geojson);
      if (computed) return computed;

      return [7.6869, 45.0703];
    }

    function extractZoom(htmlText) {
      const m = htmlText.match(/\bzoom\s*:\s*([0-9]+(?:\.[0-9]+)?)/);
      return m ? Number(m[1]) : 13;
    }

    fileInput.addEventListener('change', () => {
      processBtn.disabled = fileInput.files.length === 0;
      downloadAllBtn.disabled = true;
      updatedFiles = [];
      logEl.textContent = `Selezionati ${fileInput.files.length} file. Clicca su "Elabora file selezionati".`;
    });

    processBtn.addEventListener('click', async () => {
      updatedFiles = [];
      logEl.textContent = 'Elaborazione in corso...';
      let ok = 0;

      for (const file of fileInput.files) {
        try {
          const src = await file.text();
          const fallbackName = file.name.replace(/\.html?$/i, '');
          const { docTitle, ogTitle } = extractTitles(src, fallbackName);
          const geojson = extractGeoJson(src);

          if (!geojson) {
            log(`[ERRORE] ${file.name}: geojson non trovato`);
            continue;
          }

          const center = extractCenter(src, geojson);
          const zoom = extractZoom(src);

          const outContent = BASE_TEMPLATE
            .replace('__OG_TITLE__', escapeAttr(ogTitle))
            .replace('__DOC_TITLE__', escapeHtmlText(docTitle))
            .replace('__GEOJSON__', JSON.stringify(geojson, null, 2))
            .replace('__CENTER__', JSON.stringify(center))
            .replace('__ZOOM__', String(zoom));

          updatedFiles.push({ name: file.name, content: outContent });
          ok++;
          log(`[OK] ${file.name} -> og:title preservato: "${ogTitle}" | title: "${docTitle}"`);
        } catch (err) {
          log(`[ERRORE] ${file.name}: ${err.message}`);
        }
      }

      log(`\nCompletato: ${ok}/${fileInput.files.length} file pronti.`);
      downloadAllBtn.disabled = updatedFiles.length === 0;
    });

    downloadAllBtn.addEventListener('click', () => {
      updatedFiles.forEach((item, index) => {
        setTimeout(() => {
          const blob = new Blob([item.content], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = item.name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, index * 180);
      });
    });
  </script>
</body>
