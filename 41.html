<!DOCTYPE html>
<html lang="it">
<head>
<!-- Tag Open Graph per anteprima link -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Territorio 41 - Torino Taranto" />
  <meta property="og:description" content="Mappa interattiva con confini e navigatore Course-Up" />
  <meta property="og:image" content="https://sim-0-red.github.io/Territori/anteprima.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Territorio 41 - Torino Taranto</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; touch-action: none; }

    .nav-marker-wrapper {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .nav-arrow {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
    }

    /* Pulsante per attivare/disattivare Course-Up */
    .course-up-btn {
      background: #ffffff;
      border: none;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .course-up-btn.active {
      background: #0066ff;
      color: #ffffff;
    }

    /* Pulsante per alternare vista 2D / 3D */
    .view-mode-btn {
      background: #ffffff;
      border: none;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .view-mode-btn.is-3d {
      background: #1e293b;
      color: #ffffff;
    }

    /* Controlli zoom + / - compatibili con Course-Up */
    .zoom-step-group {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .zoom-step-btn {
      width: 32px;
      height: 32px;
      background: #ffffff;
      border: none;
      cursor: pointer;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-step-btn + .zoom-step-btn {
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }

    .zoom-step-btn:active {
      background: #e2e8f0;
    }

    #err-box {
      display: none;
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 9999;
      background: #fff3f3;
      color: #900;
      border: 2px solid #c00;
      border-radius: 6px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 35vh;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="err-box"></div>
  <script>
    window.addEventListener('error', (ev) => {
      const box = document.getElementById('err-box');
      if (box) {
        box.style.display = 'block';
        box.textContent += (box.textContent ? '\n' : '') + (ev.message || 'Errore');
      }
    });

    // Impostazioni vista: 2D (pitch 0) o 3D (pitch 60)
    const PITCH_2D = 0;
    const PITCH_3D = 60;
    const ZOOM_STEP = 0.8;
    let is3DMode = false;

    function getTargetPitch() {
      return is3DMode ? PITCH_3D : PITCH_2D;
    }

    // GeoJSON del confine Territorio 41 - Torino Taranto
    const confineGeoJSON = {
      type: "FeatureCollection",
      features: [
        {
          type: "Feature",
          id: "EwMjg",
          properties: {
            name: "Territorio 41",
            _umap_options: {
              opacity: 1,
              weight: 5
            }
          },
          geometry: {
            type: "LineString",
            coordinates: [
              [7.702167, 45.09569],
              [7.704474, 45.094699],
              [7.706782, 45.093791],
              [7.707201, 45.093639],
              [7.708617, 45.095319],
              [7.709798, 45.096621],
              [7.711172, 45.098157],
              [7.712417, 45.099126],
              [7.714295, 45.1002],
              [7.713383, 45.101487],
              [7.709379, 45.103378],
              [7.706599, 45.102531],
              [7.705601, 45.101048],
              [7.70514, 45.10017],
              [7.704796, 45.099693],
              [7.704635, 45.099497],
              [7.70426, 45.099338],
              [7.703745, 45.098747],
              [7.703627, 45.098513],
              [7.703519, 45.097582],
              [7.703347, 45.097242],
              [7.703165, 45.097166],
              [7.702199, 45.095701],
              [7.702618, 45.096394]
            ]
          }
        }
      ]
    };

    function extractCoords(geojson) {
      const coords = [];
      function walk(node) {
        if (!node) return;
        if (Array.isArray(node)) {
          if (node.length >= 2 && typeof node[0] === 'number' && typeof node[1] === 'number') {
            coords.push([node[0], node[1]]);
          } else {
            for (const item of node) walk(item);
          }
        } else if (typeof node === 'object') {
          if (node.type === 'FeatureCollection' && Array.isArray(node.features)) {
            node.features.forEach(walk);
          } else if (node.type === 'Feature') {
            walk(node.geometry);
          } else if (node.coordinates) {
            walk(node.coordinates);
          }
        }
      }
      walk(geojson);
      return coords;
    }

    function fitBoundsToGeoJSON(mapInstance, geojson, animate = false) {
      const points = extractCoords(geojson);
      if (!points.length) return;

      const bounds = new maplibregl.LngLatBounds(points[0], points[0]);
      for (const pt of points) {
        bounds.extend(pt);
      }

      const isMobile = window.innerWidth < 768;
      const padding = isMobile
        ? { top: 65, bottom: 55, left: 35, right: 35 }
        : { top: 75, bottom: 65, left: 75, right: 95 };

      mapInstance.fitBounds(bounds, {
        padding,
        maxZoom: 18,
        duration: animate ? 500 : 0
      });
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          esriStreet: {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            attribution: '© Esri, OpenStreetMap contributors'
          }
        },
        layers: [
          {
            id: 'esri-street-layer',
            type: 'raster',
            source: 'esriStreet'
          }
        ]
      },
      center: [7.6869, 45.0703],
      zoom: 13,
      pitch: PITCH_2D
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: true, showZoom: false }), 'top-right');

    // Stato Course-Up e gestione interazioni touch/camera
    let courseUpEnabled = false;
    let navMarker = null;
    let lastHeading = 0;
    let lastCoords = null;
    let isProgrammaticMove = false;
    let moveResetTimer = null;
    let isUserPinchingOrZooming = false;
    let activeTouchCount = 0;

    function moveCameraSafe(options) {
      if (isUserPinchingOrZooming) return;
      isProgrammaticMove = true;
      if (moveResetTimer) clearTimeout(moveResetTimer);
      map.easeTo(options);
      map.once('moveend', () => {
        moveResetTimer = setTimeout(() => {
          isProgrammaticMove = false;
        }, 60);
      });
    }

    function stepZoom(delta) {
      const currentZoom = map.getZoom();
      const minZoom = map.getMinZoom();
      const maxZoom = map.getMaxZoom();
      const nextZoom = Math.min(maxZoom, Math.max(minZoom, currentZoom + delta));

      const cameraOptions = {
        zoom: nextZoom,
        pitch: getTargetPitch(),
        duration: 220
      };

      if (courseUpEnabled) {
        cameraOptions.center = lastCoords || map.getCenter();
        cameraOptions.bearing = lastHeading;
      }

      moveCameraSafe(cameraOptions);
    }

    async function requestCompassPermissionIfNeeded() {
      if (
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'
      ) {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch (_) {}
      }
    }

    // Controllo dedicato per zoom + / - anche con Course-Up attivo
    class ZoomStepControl {
      onAdd(map) {
        this._map = map;
        this._container = document.createElement('div');
        this._container.className = 'maplibregl-ctrl zoom-step-group';

        const plusBtn = document.createElement('button');
        plusBtn.type = 'button';
        plusBtn.className = 'zoom-step-btn';
        plusBtn.textContent = '+';
        plusBtn.title = 'Zoom avanti';
        plusBtn.setAttribute('aria-label', 'Zoom avanti');
        plusBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          stepZoom(ZOOM_STEP);
        });

        const minusBtn = document.createElement('button');
        minusBtn.type = 'button';
        minusBtn.className = 'zoom-step-btn';
        minusBtn.textContent = '−';
        minusBtn.title = 'Zoom indietro';
        minusBtn.setAttribute('aria-label', 'Zoom indietro');
        minusBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          stepZoom(-ZOOM_STEP);
        });

        this._container.appendChild(plusBtn);
        this._container.appendChild(minusBtn);
        return this._container;
      }

      onRemove() {
        this._container.parentNode.removeChild(this._container);
        this._map = undefined;
      }
    }

    map.addControl(new ZoomStepControl(), 'top-right');

    // Controllo per passare da 2D a 3D mantenendo lo stato Course-Up
    class ViewModeControl {
      onAdd(map) {
        this._map = map;
        this._container = document.createElement('div');
        this._container.className = 'maplibregl-ctrl';

        this._btn = document.createElement('button');
        this._btn.type = 'button';
        this._btn.className = 'view-mode-btn';
        this._btn.textContent = '2D';
        this._btn.title = 'Passa tra vista 2D e vista 3D';

        this._btn.addEventListener('click', () => {
          is3DMode = !is3DMode;
          this.updateUI();

          const cameraOptions = {
            pitch: getTargetPitch(),
            duration: 450
          };

          if (courseUpEnabled && lastCoords) {
            cameraOptions.center = lastCoords;
            cameraOptions.bearing = lastHeading;
          }

          moveCameraSafe(cameraOptions);
        });

        this._container.appendChild(this._btn);
        return this._container;
      }

      updateUI() {
        if (is3DMode) {
          this._btn.textContent = '3D';
          this._btn.classList.add('is-3d');
        } else {
          this._btn.textContent = '2D';
          this._btn.classList.remove('is-3d');
        }
      }

      onRemove() {
        this._container.parentNode.removeChild(this._container);
        this._map = undefined;
      }
    }

    const viewModeCtrl = new ViewModeControl();
    map.addControl(viewModeCtrl, 'top-right');

    // Controllo personalizzato per attivare/disattivare Course-Up
    class CourseUpControl {
      onAdd(map) {
        this._map = map;
        this._container = document.createElement('div');
        this._container.className = 'maplibregl-ctrl';

        this._btn = document.createElement('button');
        this._btn.type = 'button';
        this._btn.className = 'course-up-btn';
        this._btn.innerHTML = '🧭 Course-Up';
        this._btn.title = 'Attiva/Disattiva rotazione automatica mappa';

        this._btn.addEventListener('click', async () => {
          courseUpEnabled = !courseUpEnabled;
          this.updateUI();

          if (courseUpEnabled) {
            await requestCompassPermissionIfNeeded();
            if (lastCoords) {
              moveCameraSafe({
                center: lastCoords,
                bearing: lastHeading,
                pitch: getTargetPitch(),
                duration: 450
              });
            }
          } else {
            moveCameraSafe({
              bearing: 0,
              pitch: getTargetPitch(),
              duration: 450
            });
          }
        });

        this._container.appendChild(this._btn);
        return this._container;
      }

      updateUI() {
        if (courseUpEnabled) {
          this._btn.classList.add('active');
        } else {
          this._btn.classList.remove('active');
        }
      }

      onRemove() {
        this._container.parentNode.removeChild(this._container);
        this._map = undefined;
      }
    }

    const courseUpCtrl = new CourseUpControl();
    map.addControl(courseUpCtrl, 'top-right');

    // Traccia il numero di dita sullo schermo per distinguere pinch/zoom da pan manuale
    const mapContainer = map.getCanvasContainer();
    mapContainer.addEventListener('touchstart', (ev) => {
      activeTouchCount = ev.touches.length;
      if (activeTouchCount >= 2) {
        isUserPinchingOrZooming = true;
      }
    }, { passive: true });

    mapContainer.addEventListener('touchmove', (ev) => {
      activeTouchCount = ev.touches.length;
      if (activeTouchCount >= 2) {
        isUserPinchingOrZooming = true;
      }
    }, { passive: true });

    mapContainer.addEventListener('touchend', (ev) => {
      activeTouchCount = ev.touches.length;
      if (activeTouchCount < 2) {
        setTimeout(() => {
          isUserPinchingOrZooming = false;
        }, 120);
      }
    }, { passive: true });

    map.on('zoomstart', (ev) => {
      if (!isProgrammaticMove && ev && ev.originalEvent) {
        isUserPinchingOrZooming = true;
      }
    });

    map.on('zoomend', () => {
      if (activeTouchCount < 2) {
        setTimeout(() => {
          isUserPinchingOrZooming = false;
        }, 120);
      }
    });

    // Se l'utente sposta o ruota manualmente la mappa con un dito, mette in pausa Course-Up
    map.on('dragstart', (ev) => {
      if (isProgrammaticMove || !courseUpEnabled) return;
      if (isUserPinchingOrZooming || activeTouchCount >= 2) return;
      if (ev && ev.originalEvent) {
        courseUpEnabled = false;
        courseUpCtrl.updateUI();
      }
    });

    // Crea il triangolino/freccia da navigatore
    const wrapperEl = document.createElement('div');
    wrapperEl.className = 'nav-marker-wrapper';

    const arrowEl = document.createElement('div');
    arrowEl.className = 'nav-arrow';
    arrowEl.innerHTML = `
      <svg viewBox="0 0 32 32" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
        <polygon points="16,3 27,27 16,21 5,27" fill="#0066ff" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
      </svg>
    `;
    wrapperEl.appendChild(arrowEl);

    // Pulsante mirino GPS manuale (non sposta la mappa finché non lo premi)
    const geolocate = new maplibregl.GeolocateControl({
      positionOptions: {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 5000
      },
      trackUserLocation: false,
      showUserLocation: false,
      showAccuracyCircle: false
    });
    map.addControl(geolocate, 'top-right');

    function updateNavigationView(coords, heading) {
      if (!Array.isArray(coords) || coords.length !== 2) return;
      const [lon, lat] = coords;
      if (typeof lon !== 'number' || typeof lat !== 'number' || Number.isNaN(lon) || Number.isNaN(lat)) return;

      lastCoords = [lon, lat];

      if (typeof heading === 'number' && !Number.isNaN(heading)) {
        lastHeading = ((heading % 360) + 360) % 360;
      }

      if (!navMarker) {
        navMarker = new maplibregl.Marker({
          element: wrapperEl,
          rotationAlignment: 'map',
          pitchAlignment: 'map'
        })
          .setLngLat(lastCoords)
          .setRotation(lastHeading)
          .addTo(map);
      } else {
        navMarker.setLngLat(lastCoords);
        navMarker.setRotation(lastHeading);
      }

      // Sposta la camera solo se l'utente ha attivato Course-Up e non sta facendo pinch-to-zoom con le dita
      if (courseUpEnabled && !isUserPinchingOrZooming) {
        moveCameraSafe({
          center: lastCoords,
          bearing: lastHeading,
          zoom: map.getZoom(),
          pitch: getTargetPitch(),
          duration: 300,
          easing: (t) => t
        });
      }
    }

    geolocate.on('geolocate', (e) => {
      const { longitude, latitude, heading } = e.coords;
      updateNavigationView([longitude, latitude], heading);
    });

    // Tracciamento GPS in background: aggiorna la freccia senza spostare l'inquadratura iniziale
    function startBackgroundTracking() {
      if (!('geolocation' in navigator)) return;
      navigator.geolocation.watchPosition(
        (pos) => {
          const { longitude, latitude, heading } = pos.coords;
          updateNavigationView([longitude, latitude], heading);
        },
        () => {},
        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 10000
        }
      );
    }

    window.addEventListener('deviceorientationabsolute', (e) => {
      if (typeof e.alpha === 'number' && !Number.isNaN(e.alpha) && lastCoords && courseUpEnabled) {
        const compassHeading = (360 - e.alpha) % 360;
        updateNavigationView(lastCoords, compassHeading);
      }
    });

    window.addEventListener('deviceorientation', (e) => {
      if (typeof e.webkitCompassHeading === 'number' && !Number.isNaN(e.webkitCompassHeading) && lastCoords && courseUpEnabled) {
        updateNavigationView(lastCoords, e.webkitCompassHeading);
      }
    });

    map.on('load', () => {
      if (confineGeoJSON) {
        map.addSource('confine-source', {
          type: 'geojson',
          data: confineGeoJSON
        });

        map.addLayer({
          id: 'confine-line',
          type: 'line',
          source: 'confine-source',
          layout: {
            'line-join': 'round',
            'line-cap': 'round'
          },
          paint: {
            'line-color': '#0066ff',
            'line-width': 5,
            'line-opacity': 1
          }
        });

        fitBoundsToGeoJSON(map, confineGeoJSON, false);
      }

      startBackgroundTracking();
    });
  </script>
</body>
</html>
