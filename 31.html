<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappa con Confini Blu e Navigatore Course-Up</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }

    .nav-marker-wrapper {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .nav-arrow {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
    }

    /* Pulsante per attivare/disattivare Course-Up */
    .course-up-btn {
      background: #ffffff;
      border: none;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .course-up-btn.active {
      background: #0066ff;
      color: #ffffff;
    }

    /* Pulsante per alternare vista 2D / 3D */
    .view-mode-btn {
      background: #ffffff;
      border: none;
      border-radius: 4px;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      padding: 6px 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .view-mode-btn.is-3d {
      background: #1e293b;
      color: #ffffff;
    }

    #err-box {
      display: none;
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 9999;
      background: #fff3f3;
      color: #900;
      border: 2px solid #c00;
      border-radius: 6px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 35vh;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="err-box"></div>
  <script>

      const box = document.getElementById('err-box');
      if (box) {
        box.style.display = 'block';
        box.textContent += (box.textContent ? '\n' : '') + (ev.message || 'Errore');
      }
    });

    // Impostazioni vista: 2D (pitch 0) o 3D (pitch 60)
    const PITCH_2D = 0;
    const PITCH_3D = 60;
    let is3DMode = false;

    function getTargetPitch() {
      return is3DMode ? PITCH_3D : PITCH_2D;
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          esriStreet: {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            attribution: '© Esri, OpenStreetMap contributors'
          }
        },
        layers: [
          {
            id: 'esri-street-layer',
            type: 'raster',
            source: 'esriStreet'
          }
        ]
      },
      center: [7.6969, 45.0896],
      zoom: 14,
      pitch: PITCH_2D
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'top-right');

    // Stato Course-Up disattivato di default all'apertura
    let courseUpEnabled = false;
    let navMarker = null;
    let lastHeading = 0;
    let lastCoords = null;
    let isProgrammaticMove = false;

    function moveCameraSafe(options) {
      isProgrammaticMove = true;
      map.easeTo(options);
      map.once('moveend', () => {
        isProgrammaticMove = false;
      });
    }

    async function requestCompassPermissionIfNeeded() {
      if (
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'
      ) {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch (_) {}
      }
    }
